<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fibergrid Infoboard</title><style>
:root{color-scheme:dark;font-family:Arial,Helvetica,sans-serif}*{box-sizing:border-box}body{margin:0;background:#06111f;color:#f4f8ff;overflow:hidden}.screen{height:100vh;display:grid;grid-template-rows:24% 1fr 7%;padding:2.5vh 3vw;gap:2vh;background:radial-gradient(ellipse at 100% 100%,#10355b 0%,#06111f 55%)}header{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid #3296e9;padding-bottom:1vh}header img{width:min(46vw,800px);max-height:100%;object-fit:contain;object-position:left center}.clock{text-align:right}.time{font-size:clamp(36px,5.4vw,95px);font-weight:700;letter-spacing:1px}.date{font-size:clamp(17px,1.8vw,32px);color:#a8c3dd}main{display:grid;grid-template-columns:1.15fr .85fr;gap:2vw;min-height:0}.panel{border:1px solid #1d476b;background:#0c1e32e8;border-radius:18px;padding:2.3vh 2.2vw;min-height:0}.panel h2{font-size:clamp(20px,2.25vw,38px);margin:0 0 2vh;color:#5eb6ff}.item{display:grid;grid-template-columns:6vw 1fr;gap:1vw;align-items:center;border-bottom:1px solid #23415c;padding:1.5vh 0;font-size:clamp(16px,1.65vw,30px)}.item .hour{color:#58b9ff;font-weight:bold}.item:last-child{border:0}.right{display:grid;grid-template-rows:57% 1fr;gap:2vh;min-height:0}.weather{display:flex;align-items:center;gap:2vw}.weather .temp{font-size:clamp(55px,7vw,118px);font-weight:bold}.weather .description{font-size:clamp(16px,1.8vw,31px)}.weather .symbol{font-size:clamp(45px,5vw,90px)}.forecast{display:flex;gap:2vw;color:#a8c3dd;font-size:clamp(15px,1.4vw,25px);margin-top:2vh}.message{font-size:clamp(18px,1.8vw,32px);line-height:1.35}footer{display:flex;align-items:center;justify-content:space-between;color:#85a9c9;font-size:clamp(12px,1.2vw,23px)}.accent{color:#5eb6ff}@media(max-width:700px){.screen{padding:2vh 3vw}.panel{border-radius:10px}.item{padding:1vh 0}.panel h2{margin-bottom:1vh}}
</style></head><body><div class="screen"><header><img src="logo.png" alt="Fibergrid – be connected"><div class="clock"><div class="time" id="time">--:--</div><div class="date" id="date">Datum wird geladen</div></div></header><main><section class="panel"><h2>Tagesprogramm</h2><div id="schedule"></div></section><div class="right"><section class="panel"><h2>Wetter · Oberhasli ZH</h2><div class="weather"><div class="symbol" id="symbol">◌</div><div><div class="temp" id="temp">--°</div><div class="description" id="description">Wetter wird geladen …</div></div></div><div class="forecast" id="forecast"></div></section><section class="panel"><h2>Mitteilungen</h2><div class="message" id="notice">Willkommen im Fibergrid-Magazin.<br>Bitte Sicherheitsvorschriften beachten.</div></section></div></main><footer><span>FIBERGRID · BE CONNECTED</span><span id="status">Wetterdaten: noch nicht geladen</span></footer></div><script>
// Beispielprogramm: Diese Einträge können später mit einer OneDrive-/Excel-Anbindung ersetzt werden.
const programm=[['07:00','Materialausgabe und Vorbereitung'],['07:30','Teambriefing / Tagesaufträge'],['08:00','Abfahrt zu den Baustellen'],['12:00','Mittagspause'],['16:30','Rapporte und Materialrückgabe']];
document.getElementById('schedule').innerHTML=programm.map(([t,s])=>'<div class="item"><span class="hour">'+t+'</span><span>'+s+'</span></div>').join('');
function clock(){const d=new Date();document.getElementById('time').textContent=new Intl.DateTimeFormat('de-CH',{timeZone:'Europe/Zurich',hour:'2-digit',minute:'2-digit'}).format(d);document.getElementById('date').textContent=new Intl.DateTimeFormat('de-CH',{timeZone:'Europe/Zurich',weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d)}clock();setInterval(clock,1000);
function weatherName(c){if(c===0)return ['☀','Sonnig'];if(c<=3)return ['⛅','Teilweise bewölkt'];if(c<=48)return ['☁','Nebel'];if(c<=67)return ['🌧','Regen'];if(c<=77)return ['❄','Schnee'];if(c<=82)return ['🌦','Regenschauer'];if(c<=86)return ['❄','Schneeschauer'];if(c>=95)return ['⛈','Gewitter'];return ['☁','Bewölkt']}
async function loadWeather(){try{const url='https://api.open-meteo.com/v1/forecast?latitude=47.47&longitude=8.50&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FZurich&forecast_days=3';const r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status);const w=await r.json();const [symbol,desc]=weatherName(w.current.weather_code);document.getElementById('symbol').textContent=symbol;document.getElementById('temp').textContent=Math.round(w.current.temperature_2m)+'°C';document.getElementById('description').textContent=desc;document.getElementById('forecast').innerHTML=w.daily.time.map((day,i)=>'<span>'+new Intl.DateTimeFormat('de-CH',{weekday:'short'}).format(new Date(day+'T12:00:00'))+': '+weatherName(w.daily.weather_code[i])[0]+' '+Math.round(w.daily.temperature_2m_max[i])+'° / '+Math.round(w.daily.temperature_2m_min[i])+'°</span>').join('');document.getElementById('status').textContent='Wetter: automatisch aktualisiert'}catch(e){document.getElementById('description').textContent='Wetter derzeit nicht verfügbar';document.getElementById('status').textContent='Wetterverbindung prüfen'}}loadWeather();setInterval(loadWeather,15*60*1000);
</script></body></html>
